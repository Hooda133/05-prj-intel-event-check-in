<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel Sustainability Summit Check-In</title>
    <meta
      name="description"
      content="Event attendee check-in and team tracking system for the Intel Sustainability Summit."
    />
    <meta property="og:title" content="Intel Sustainability Summit Check-In" />
    <meta
      property="og:description"
      content="Event attendee check-in and team tracking system for the Intel Sustainability Summit."
    />
    <link rel="icon" href="img/intel-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Hero section with Intel branding -->
    <header class="hero">
      <div class="hero-content">
        <img src="img/intel-logo.svg" alt="Intel Logo" class="intel-logo" />
        <h1>Team Sustainability Summit</h1>
        <div class="hero-divider"></div>
        <p>
          <svg class="inline-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 4c-8 0-14 4-14 11a5 5 0 0 0 5 5c7 0 11-6 9-16Z"/><path d="M4 21c3-6 7-9 12-12"/></svg> Check-in system for sustainability event attendees
        </p>
      </div>
    </header>
    <main>
      <!-- Attendance tracking -->
      <div class="attendance-tracker">
        <div class="attendance-header">
          <svg class="inline-icon attendance-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Attendance: <span id="attendeeCount">0</span>/50
        </div>
        <div class="progress-container" role="progressbar" aria-label="Attendance goal" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
      <div class="container">
        <!-- Feedback message -->
        <p id="greeting" role="status" aria-live="polite" aria-atomic="true"></p>

        <!-- Check-in form -->
        <form class="check-in" id="checkInForm">
          <h2 class="form-label">Attendee Check-In</h2>
          <div class="form-group">
            <div class="field">
              <label for="attendeeName">Attendee name</label>
              <input
                type="text"
                id="attendeeName"
                name="attendeeName"
                placeholder="Enter name..."
                autocomplete="name"
                maxlength="100"
                required
              />
            </div>
            <div class="field">
              <label for="teamSelect">Team</label>
              <select id="teamSelect" name="team" required>
                <option value="" disabled selected>Select Team...</option>
                <option value="water">Team Water Wise</option>
                <option value="zero">Team Net Zero</option>
                <option value="power">Team Renewables</option>
              </select>
            </div>
            <button type="submit" id="checkInBtn">
              <span aria-hidden="true">✓</span> Check In
            </button>
          </div>
        </form>

        <!-- Team stats -->
        <div class="team-stats">
          <h2>Team Attendance</h2>
          <div class="teams-grid">
            <div class="team-card water">
              <span class="team-name"><svg class="team-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13Z"/><path d="M8 16a4 4 0 0 0 4 4"/></svg>Team Water Wise</span>
              <span class="team-count" id="waterCount">0</span>
            </div>
            <div class="team-card zero">
              <span class="team-name"><svg class="team-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 4c-8 0-14 4-14 11a5 5 0 0 0 5 5c7 0 11-6 9-16Z"/><path d="M4 21c3-6 7-9 12-12"/></svg>Team Net Zero</span>
              <span class="team-count" id="zeroCount">0</span>
            </div>
            <div class="team-card power">
              <span class="team-name"><svg class="team-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z"/></svg>Team Renewables</span>
              <span class="team-count" id="powerCount">0</span>
            </div>
          </div>
        </div>
      </div>

    </main>

    <footer class="footer">
      Intel Sustainability Summit •
      <a
        href="https://www.intel.com/content/www/us/en/corporate-responsibility/2030-goals.html"
        class="footer-link"
        >Sustainability Goals</a
      >
    </footer>

    <script src="script.js"></script>
  </body>
</html>
